[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dinoapp"
version = "0.2.0"
description = "Streamlit reviewer for BrdU/EdU cell labels"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Chaichontat Sriworarat" },
]
dependencies = [
    "dino-markers>=0.1.0",
    "pandas>=2.0",
    "streamlit>=1.63",
]

[project.optional-dependencies]
native = [
    "thesis-dino>=0.2.0",
    "joblib",
    "squisher",
    "anndata",
    "libigl",
    "matplotlib",
    "numpy",
    "pyarrow",
    "scikit-image",
    "zarr",
]
legacy = [
    "numpy",
    "scikit-learn",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.12",
]

[project.scripts]
dinoapp = "dinoapp.app:launch"
dinoapp-legacy = "dinoapp.legacy_labeler:launch"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
ignore = ["E501"]
