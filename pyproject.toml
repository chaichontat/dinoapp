[tool.uv.workspace]
members = ["dinoapp", "dino", "markers"]

[tool.uv]
# dinov2 pins its 2023 training stack; Cell-DINO inference needs only torch and torchvision.
override-dependencies = [
    "torch",
    "torchvision",
    "torchmetrics; sys_platform == 'never'",
    "xformers; sys_platform == 'never'",
    "cuml-cu11; sys_platform == 'never'",
    "fvcore; sys_platform == 'never'",
    "iopath; sys_platform == 'never'",
    "omegaconf; sys_platform == 'never'",
    "submitit; sys_platform == 'never'",
]

[tool.uv.sources]
dinoapp = { workspace = true }
dino-markers = { workspace = true }
thesis-dino = { workspace = true }
squisher = { git = "https://github.com/chaichontat/squisher", rev = "4cd1423aaacedda1fe3f4326411455e271eaf872", subdirectory = "squisher" }
squisher-segment = { git = "https://github.com/chaichontat/squisher", rev = "4cd1423aaacedda1fe3f4326411455e271eaf872", subdirectory = "segment" }
dinov2 = { git = "https://github.com/chaichontat/dinov2", rev = "76d1757bbb72097b7f0126c4d0081f4fea483e67" }

[tool.pytest.ini_options]
testpaths = ["dinoapp/tests", "dino/tests", "markers/tests"]
markers = ["integration: public workflow and artifact behavior"]
